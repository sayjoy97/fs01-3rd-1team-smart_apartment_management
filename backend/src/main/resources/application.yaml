server:
  port: 9600

spring:
  application:
    name: fs01-3rd-1team-smart_apartment_management

  datasource:
    driver-class-name: ${JJLD_DRIVER}
    url: ${JJLD_URL}
    username: ${JJLD_USER}
    password: ${JJLD_PASS}
  sql:
    init:
      encoding: UTF-8
      mode: always

  jpa:
    #    show-sql: true
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

    defer-datasource-initialization: true

  mqtt:
    url: tcp://localhost:1883 # 브로커의 주소
    client-id: jjld-apartment-management2
    topic:
      command: jjld/command
      garden: "jjld/garden/#"
      elevator: "jjld/elevator/#"
      energy: "jjld/energy/#"
      noise: "jjld/noise/#"
      cargate: "jjld/cargate/#"
      entrance: "jjld/entrance/#"

  springdoc:
    cache:
      disabled: true # 캐시 사용 여부
    api-docs:
      path: /v3/api-docs
      groups:
        enabled: true
    swagger-ui:
      enabled: true # Swagger UI 접근 경로 => http://localhost:9600/swagger-ui/index.html
      path: /swagger.html # Swagger UI 추가 접근 경로 => http://localhost:8080/swagger.html
      tags-sorter: alpha # alpha: 알파벳 순 태그 정렬, method: HTTP Method 순 정렬
      operations-sorter: alpha # alpha: 알파벳 순 태그 정렬, method: HTTP Method 순 정렬

jwt:
  header: ${JWT_HEADER}
  secret: ${JWT_SECRET}
  token-valid-in-second: 3600000
#  token-valid-in-second: 120000
  refresh-token-valid-in-second: 604800000  # 7일
